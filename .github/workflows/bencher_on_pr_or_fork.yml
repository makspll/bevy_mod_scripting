name: Run benchmarks on PR

# Benchmarks are slow and share runners with everything else, so on pull requests they only run when:
#  - a maintainer comments `/bench` on the pull request
#  - the `performance` label is applied to the pull request (and on every push to it after that)
#  - the pull request changes benchmark code or assets
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  issue_comment:
    types: [created]

# the benchmarks run untrusted code, and the results are published by `bencher_on_pr_or_fork_upload.yml`
permissions:
  contents: read

concurrency:
  # events which won't start benchmarks (other comments and labels) get their own group, so they can't cancel a running one
  group: ${{ github.workflow }}-${{ ((github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '/bench')) || (github.event.action == 'labeled' && github.event.label.name != 'performance')) && github.run_id || (github.event.pull_request.number || github.event.issue.number) }}
  cancel-in-progress: true

jobs:
  decide:
    name: Decide if benchmarks should run
    runs-on: ubuntu-latest
    # comments on plain issues, or by people who can't push to the repository never start benchmarks
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/bench') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      pull-requests: read
      issues: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      head_ref: ${{ steps.decide.outputs.head_ref }}
      base_ref: ${{ steps.decide.outputs.base_ref }}
      base_sha: ${{ steps.decide.outputs.base_sha }}
    steps:
      - name: Decide
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            const isComment = context.eventName === 'issue_comment';
            const number = isComment ? context.payload.issue.number : context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });

            const labels = pr.labels.map(l => l.name);
            let reason = null;
            if (isComment) {
              reason = 'requested with a `/bench` comment';
              await github.rest.reactions.createForIssueComment({
                ...context.repo, comment_id: context.payload.comment.id, content: 'rocket',
              });
            } else if (context.payload.action === 'labeled') {
              // only the performance label is interesting, other labels must not restart anything
              if (context.payload.label.name === 'performance') reason = 'the `performance` label was applied';
            } else if (labels.includes('performance')) {
              reason = 'the PR has the `performance` label';
            } else {
              const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: number, per_page: 100 });
              const touched = files.find(f => /^(benches|assets)\//.test(f.filename) || /^(benches|assets)\//.test(f.previous_filename || ''));
              if (touched) reason = `benchmark code or assets changed (${touched.filename})`;
            }

            core.info(reason ? `Running benchmarks: ${reason}` : 'Not running benchmarks');
            core.setOutput('run', reason ? 'true' : 'false');
            core.setOutput('pr_number', number);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('base_sha', pr.base.sha);

  benchmark_fork_pr_branch:
    name: Run PR Benchmarks
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # works for both the pull_request and issue_comment events, and for forks
          ref: refs/pull/${{ needs.decide.outputs.pr_number }}/merge
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.7.7
        with:
          # shares the cache of the benchmarks job which runs on main
          shared-key: bencher-ubuntu-latest
          # never save from here: for comments this workflow runs on the default branch, but with pull request code
          save-if: false
          cache-all-crates: true
      - name: Run `cargo xtask init`
        run: |
          cargo xtask init --dont-update-ide --tools
      - name: Run `cargo xtask bench` and save results
        run: |
          cargo xtask bench > benchmark_results.txt
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark_results.txt
          path: ./benchmark_results.txt
      # the upload workflow only needs these, whichever event started this run
      - name: Write PR event
        env:
          PR_NUMBER: ${{ needs.decide.outputs.pr_number }}
          PR_HEAD: ${{ needs.decide.outputs.head_ref }}
          PR_BASE: ${{ needs.decide.outputs.base_ref }}
          PR_BASE_SHA: ${{ needs.decide.outputs.base_sha }}
        run: |
          jq -n \
            --argjson number "$PR_NUMBER" \
            --arg head "$PR_HEAD" \
            --arg base "$PR_BASE" \
            --arg base_sha "$PR_BASE_SHA" \
            '{number: $number, pull_request: {head: {ref: $head}, base: {ref: $base, sha: $base_sha}}}' \
            > event.json
      - name: Upload GitHub Pull Request Event
        uses: actions/upload-artifact@v4
        with:
          name: event.json
          path: ./event.json
