name: Upload benchmarks to bencher

on:
  workflow_run:
    workflows: [Run benchmarks on PR]
    types: [completed]

permissions: write-all

jobs:
  track_fork_pr_branch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      BENCHMARK_RESULTS: benchmark_results.txt
      PR_EVENT: event.json
    steps:
      # the benchmark workflow succeeds without producing anything when it decided not to run
      - name: Check benchmarks ran
        id: ran
        uses: actions/github-script@v6
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: context.payload.workflow_run.id,
            });
            core.setOutput('ran', data.artifacts.some(a => a.name === 'benchmark_results.txt') ? 'true' : 'false');
      - name: Download Benchmark Results
        if: steps.ran.outputs.ran == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          name: ${{ env.BENCHMARK_RESULTS }}
          run_id: ${{ github.event.workflow_run.id }}
      - name: Download PR Event
        if: steps.ran.outputs.ran == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          name: ${{ env.PR_EVENT }}
          run_id: ${{ github.event.workflow_run.id }}
      - name: Export PR Event Data
        if: steps.ran.outputs.ran == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            let fs = require('fs');
            let prEvent = JSON.parse(fs.readFileSync(process.env.PR_EVENT, {encoding: 'utf8'}));
            core.exportVariable("PR_HEAD", prEvent.pull_request.head.ref);
            core.exportVariable("PR_BASE", prEvent.pull_request.base.ref);
            core.exportVariable("PR_BASE_SHA", prEvent.pull_request.base.sha);
            core.exportVariable("PR_NUMBER", prEvent.number);
      - uses: bencherdev/bencher@main
        if: steps.ran.outputs.ran == 'true'
      - name: Track Benchmarks with Bencher
        if: steps.ran.outputs.ran == 'true'
        run: |
          bencher run \
          --project bms \
          --token '${{ secrets.BENCHER_API_TOKEN }}' \
          --branch "$PR_HEAD" \
          --start-point "$PR_BASE" \
          --start-point-hash "$PR_BASE_SHA" \
          --start-point-clone-thresholds \
          --start-point-reset \
          --testbed linux-gha \
          --err \
          --adapter rust_criterion \
          --github-actions '${{ secrets.GITHUB_TOKEN }}' \
          --ci-number "$PR_NUMBER" \
          --file "$BENCHMARK_RESULTS"