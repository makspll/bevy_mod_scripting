[workspace]
# cargo-semver-checks builds the crate with all features enabled (release-plz cannot restrict them),
# which fails since the lua backends (lua51, lua54, luajit, luau, ...) are mutually exclusive in mlua-sys.
# release-plz < 0.3.163 silently ignored this failure, newer versions abort the release PR with it.
# see https://github.com/release-plz/release-plz/issues/2291
semver_check = false
dependencies_update = false
publish_timeout = "30m"
git_release_enable = false
git_tag_enable = false
git_release_body = """
{{ changelog }}
{% if remote.contributors %}
### Contributors
{% for contributor in remote.contributors | unique(attribute="username") %}
* @{{ contributor.username }}
{% endfor %}
{% endif %}
"""

[changelog]
commit_parsers = [
    # dont include chore changes in changelog
    { message = "^chore.*", skip = true },
    { message = "^test.*", skip = true },
    { message = "^docs.*", skip = true },
    { message = "^.*SKIP_CHANGELOG.*$", skip = true },
    { message = "^feat", group = "added" },
    { message = "^changed", group = "changed" },
    { message = "^deprecated", group = "deprecated" },
    { message = "^refactor", group = "refactored" },
    { message = "^fix", group = "fixed" },
    { message = "^security", group = "security" },
    { message = "^.*", group = "other" },
]

[[package]]
name = "bevy_mod_scripting"
publish_features = ["lua54"]
version_group = "main"
git_release_latest = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

changelog_include = [
    "bevy_mod_scripting_lua",
    "bevy_mod_scripting_core",
    "bevy_mod_scripting_derive",
    "bevy_mod_scripting_rhai",
    "bevy_mod_scripting_rune",
    "bevy_mod_scripting_functions",
    "lua_language_server_lad_backend",
    "ladfile",
    "ladfile_builder",
    "mdbook_lad_preprocessor",
    "bevy_system_reflection",

    ## bindings crates 

    "bevy_mod_scripting_bevy_animation_bindings",
    "bevy_mod_scripting_bevy_asset_bindings",
    "bevy_mod_scripting_bevy_camera_bindings",
    "bevy_mod_scripting_bevy_color_bindings",
    "bevy_mod_scripting_bevy_ecs_bindings",
    "bevy_mod_scripting_bevy_gizmos_bindings",
    "bevy_mod_scripting_bevy_input_bindings",
    "bevy_mod_scripting_bevy_window_bindings",
    "bevy_mod_scripting_bevy_audio_bindings",
    "bevy_mod_scripting_bevy_state_bindings",
    "bevy_mod_scripting_bevy_math_bindings",
    "bevy_mod_scripting_bevy_render_bindings",
    "bevy_mod_scripting_bevy_sprite_bindings",
    "bevy_mod_scripting_bevy_text_bindings",
    "bevy_mod_scripting_bevy_time_bindings",
    "bevy_mod_scripting_bevy_transform_bindings",
    "bevy_mod_scripting_bevy_ui_bindings",
]

