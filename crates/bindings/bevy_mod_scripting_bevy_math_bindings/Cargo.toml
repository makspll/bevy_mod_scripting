[package]
name = "bevy_mod_scripting_bevy_math_bindings"
description = "Script bindings for bevy math: vectors, quaternions, matrices, directions, rectangles, rays, shapes and easing"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
test = false

[dependencies]
bevy_mod_scripting_bindings = { workspace = true }
bevy_mod_scripting_derive = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true, features = ["std", "bevy_reflect"] }
bevy_reflect = { workspace = true, features = ["glam"] }
bevy_math = { workspace = true, features = ["bevy_reflect"] }
bevy_shape = { workspace = true, features = ["bevy_reflect"] }
bevy_curve = { workspace = true, features = ["bevy_reflect"] }

[lints]
workspace = true
