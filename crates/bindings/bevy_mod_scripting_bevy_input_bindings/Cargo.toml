[package]
name = "bevy_mod_scripting_bevy_input_bindings"
description = "Script bindings for bevy input: keyboard, mouse, gamepads, touch and focus"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
test = false

[dependencies]
bevy_mod_scripting_bindings = { workspace = true }
bevy_mod_scripting_derive = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true, features = ["std", "bevy_reflect"] }
bevy_reflect = { workspace = true }
bevy_math = { workspace = true, features = ["bevy_reflect"] }
bevy_input = { workspace = true, features = [
    "bevy_reflect",
    "std",
    "keyboard",
    "mouse",
    "gamepad",
    "touch",
] }
bevy_input_focus = { workspace = true }

[lints]
workspace = true
