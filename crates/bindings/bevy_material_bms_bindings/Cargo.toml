[package]
name = "bevy_material_bms_bindings"
description = "Automatically generated bindings for bevy_material crate"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
test = false

[dependencies]

bevy_app = { workspace = true, features = ["std"] }
bevy_mod_scripting_core = { workspace = true }
bevy_mod_scripting_bindings = { workspace = true }
bevy_mod_scripting_derive = { workspace = true }
bevy_material = { version = "0.19.0", features = [], default-features = true}


bevy_asset = { version = "^0.19.0", features = ["file_watcher", "multi_threaded", "notify-debouncer-full", "watch"], default-features = true}

bevy_derive = { version = "^0.19.0", features = [], default-features = true}

bevy_ecs = { version = "^0.19.0", features = ["async_executor", "backtrace", "bevy_reflect", "multi_threaded", "reflect_auto_register", "serialize", "std"], default-features = true}

bevy_material_macros = { version = "^0.19.0", features = [], default-features = true}

bevy_mesh = { version = "^0.19.0", features = ["bevy_mikktspace", "morph"], default-features = true}

bevy_platform = { version = "^0.19.0", features = ["alloc", "futures-lite", "serialize", "std"], default-features = true}

bevy_reflect = { version = "^0.19.0", features = ["auto_register", "auto_register_inventory", "debug", "debug_stack", "glam", "indexmap", "smallvec", "smol_str", "std", "uuid", "wgpu-types"], default-features = true}

bevy_shader = { version = "^0.19.0", features = [], default-features = true}

bevy_utils = { version = "^0.19.0", features = ["buffered_channel", "parallel"], default-features = true}

encase = { version = "^0.12", features = [], default-features = true}

variadics_please = { version = "^1.1", features = [], default-features = true}


