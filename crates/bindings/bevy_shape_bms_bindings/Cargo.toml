[package]
name = "bevy_shape_bms_bindings"
description = "Automatically generated bindings for bevy_shape crate"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
test = false

[dependencies]
bevy_ecs = { workspace = true, features = ["std", "bevy_reflect"] }
bevy_app = { workspace = true, features = ["std"] }
bevy_mod_scripting_core = { workspace = true }
bevy_mod_scripting_bindings = { workspace = true }
bevy_mod_scripting_derive = { workspace = true }
bevy_shape = { version = "0.20.0", features = ["alloc", "bevy_reflect", "rand", "std"], default-features = true}


bevy_math = { version = "^0.20.0", features = ["alloc", "approx", "bevy_reflect", "nostd-libm", "rand", "serialize", "std"], default-features = true}

bevy_reflect = { version = "^0.20.0", features = ["auto_register", "auto_register_inventory", "debug", "debug_stack", "glam", "indexmap", "petgraph", "smallvec", "smol_str", "std", "uuid", "wgpu-types"], default-features = true}

derive_more = { version = "^2", features = ["std"], default-features = false}

rand = { version = "^0.10", features = ["std"], default-features = false}

rand_distr = { version = "^0.6", features = ["alloc", "std"], default-features = false}


