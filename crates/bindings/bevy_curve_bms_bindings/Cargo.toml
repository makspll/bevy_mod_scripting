[package]
name = "bevy_curve_bms_bindings"
description = "Automatically generated bindings for bevy_curve crate"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
test = false

[dependencies]
bevy_ecs = { workspace = true, features = ["std", "bevy_reflect"] }
bevy_app = { workspace = true, features = ["std"] }
bevy_mod_scripting_core = { workspace = true }
bevy_mod_scripting_bindings = { workspace = true }
bevy_mod_scripting_derive = { workspace = true }
bevy_curve = { version = "0.20.0", features = ["alloc", "bevy_reflect", "serialize", "std"], default-features = true}


bevy_math = { version = "^0.20.0", features = ["alloc", "approx", "bevy_reflect", "nostd-libm", "rand", "serialize", "std"], default-features = true}

bevy_reflect = { version = "^0.20.0", features = ["auto_register", "auto_register_inventory", "debug", "debug_stack", "glam", "indexmap", "petgraph", "smallvec", "smol_str", "std", "uuid", "wgpu-types"], default-features = true}

itertools = { version = "^0.14.0", features = ["use_alloc", "use_std"], default-features = false}

serde = { version = "^1", features = ["alloc", "std"], default-features = false}

variadics_please = { version = "^2.0", features = [], default-features = true}


