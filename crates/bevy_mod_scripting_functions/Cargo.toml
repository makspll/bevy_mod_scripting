bevy_mod_scripting_bindings_domain = { workspace = true }
bevy_mod_scripting_display = { workspace = true }
bevy_mod_scripting_asset = { workspace = true }
bevy_mod_scripting_script = { workspace = true }
bevy_mod_scripting_derive = { workspace = true }
bevy_mod_scripting_lua = { path = "../languages/bevy_mod_scripting_lua", optional = true, version = "0.23.0" }
bevy_mod_scripting_rune = { path = "../languages/bevy_mod_scripting_rune", optional = true, version = "0.23.0" }
bevy_mod_scripting_world = { workspace = true }
bevy_system_reflection = { path = "../bevy_system_reflection", version = "0.23.0" }

bevy_ecs = { workspace = true, features = ["std", "bevy_reflect"] }
bevy_app = { workspace = true }
bevy_asset = { workspace = true }
bevy_log = { workspace = true }
bevy_platform = { workspace = true, features = ["std"] }
bevy_reflect = { workspace = true, features = [] }

bevy_mod_scripting_bevy_animation_bindings = { path = "../bindings/bevy_mod_scripting_bevy_animation_bindings", version = "0.23.0", optional = true }
