[package]
name = "bevy_mod_scripting_functions"
description = "Necessary functionality for Lua support with bevy_mod_scripting"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[features]
bevy_a11y = ["bevy_a11y_bms_bindings"]
bevy_animation = ["bevy_animation_bms_bindings"]
bevy_asset = ["bevy_mod_scripting_bevy_asset_bindings"]
bevy_camera = ["bevy_mod_scripting_bevy_camera_bindings"]
bevy_color = ["bevy_mod_scripting_bevy_color_bindings"]
bevy_ecs = ["bevy_mod_scripting_bevy_ecs_bindings"]
bevy_gizmos = ["bevy_gizmos_bms_bindings"]
bevy_input = ["bevy_mod_scripting_bevy_input_bindings"]
bevy_window = ["bevy_mod_scripting_bevy_window_bindings"]
bevy_math = ["bevy_mod_scripting_bevy_math_bindings"]
bevy_picking = ["bevy_picking_bms_bindings"]
bevy_render = ["bevy_mod_scripting_bevy_render_bindings"]
bevy_scene = ["bevy_scene_bms_bindings"]
bevy_sprite = ["bevy_sprite_bms_bindings"]
bevy_sprite_render = ["bevy_sprite_render_bms_bindings"]
bevy_text = ["bevy_text_bms_bindings"]
bevy_time = ["bevy_mod_scripting_bevy_time_bindings"]
bevy_transform = ["bevy_mod_scripting_bevy_transform_bindings"]
bevy_ui = ["bevy_ui_bms_bindings"]
bevy_ui_render = ["bevy_ui_render_bms_bindings"]
bevy_ui_widgets = ["bevy_ui_widgets_bms_bindings"]

core_functions = []
lua_bindings = ["bevy_mod_scripting_lua"]
rhai_bindings = ["bevy_mod_scripting_rhai"]


[dependencies]
profiling = { workspace = true }
bevy_mod_scripting_core = { workspace = true }
