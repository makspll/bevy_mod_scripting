[package]
name = "bevy_mod_scripting_reactive_ui"
description = "Prototype of reactive, script driven bevy_ui trees for bevy_mod_scripting"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
# The `reactive_ui_test` script namespace, see `ReactiveUiTestPlugin`
testing = ["dep:bevy_camera", "dep:bevy_math"]

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true, features = ["std", "bevy_reflect"] }
bevy_reflect = { workspace = true }
bevy_color = { workspace = true }
bevy_log = { workspace = true }
bevy_platform = { workspace = true }
bevy_ui = { version = "0.20", default-features = false }
bevy_text = { workspace = true }
bevy_asset = { workspace = true }
bevy_image = { workspace = true }
bevy_picking = { version = "0.20", default-features = false }
bevy_input = { version = "0.20", default-features = false }
# laying out screens in tests, see `Screen::rect`
bevy_camera = { version = "0.20", default-features = false, optional = true }
bevy_math = { workspace = true, optional = true }
bevy_mod_scripting_asset = { workspace = true }
bevy_mod_scripting_bindings = { workspace = true }
bevy_mod_scripting_core = { workspace = true }
bevy_mod_scripting_derive = { workspace = true }
bevy_mod_scripting_script = { workspace = true }
parking_lot = { workspace = true }

[lints]
workspace = true
